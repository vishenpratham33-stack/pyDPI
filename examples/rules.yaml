# Used with:  pydpi analyze demo.pcap --rules examples/rules.yaml
block_apps:
  - TikTok
  - Netflix
block_domains:
  - ads.example.com        # this domain and every subdomain
  - "*.tracker.net"        # wildcard: subdomains only
  - gambling               # bare keyword: substring match
block_ips:
  - 192.168.1.50
  - 10.66.0.0/16           # CIDR ranges and IPv6 work too
