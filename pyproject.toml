[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydpi"
version = "1.0.0"
description = "PyDPI - a Deep Packet Inspection engine (TLS SNI, QUIC, HTTP, DNS) with offline and live analysis, in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "dpkt>=1.9.8",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pydpi = "pydpi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pydpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
